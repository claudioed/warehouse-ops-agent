{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "warehouse-ops-agent.credentialsSecretName" . }}
  labels:
    {{- include "warehouse-ops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  WES_WORK_PLANNING_MCP_READ_KEY: {{ .Values.credentials.wesWorkPlanningReadKey | quote }}
  FULFILLMENT_EXECUTION_MCP_READ_KEY: {{ .Values.credentials.fulfillmentExecutionReadKey | quote }}
  INVENTORY_STORAGE_MCP_READ_KEY: {{ .Values.credentials.inventoryStorageReadKey | quote }}
  WORKFORCE_MANAGEMENT_MCP_READ_KEY: {{ .Values.credentials.workforceManagementReadKey | quote }}
  FACILITY_LAYOUT_MCP_READ_KEY: {{ .Values.credentials.facilityLayoutReadKey | quote }}
  MCP_READ_KEY: {{ .Values.credentials.mcpReadKey | quote }}
  MCP_READWRITE_KEY: {{ .Values.credentials.mcpReadWriteKey | quote }}
{{- end }}
