{{- if not .Values.credentials.existingSecret }}
{{- if .Values.credentials.anthropicApiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "warehouse-ops-agent.credentialsSecretName" . }}
  labels:
    {{- include "warehouse-ops-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  ANTHROPIC_API_KEY: {{ .Values.credentials.anthropicApiKey | quote }}
{{- end }}
{{- end }}
